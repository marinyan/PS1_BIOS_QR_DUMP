name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test ELF to PS-X EXE conversion
        run: python -m unittest dumper/tests/test_elf2psx.py
      - name: Test browser protocol implementation
        run: node receiver/test.cjs
      - name: Test C and JavaScript protocol vectors
        run: |
          mkdir -p dumper/build
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Idumper \
            dumper/protocol.c dumper/tests/protocol_test.c \
            -o dumper/build/protocol_test
          dumper/build/protocol_test
      - name: Compile-check bare-metal C sources
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Idumper \
            -c dumper/main.c -o dumper/build/main-host.o
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Idumper \
            -c dumper/protocol.c -o dumper/build/protocol-host.o

  mips-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MIPS GCC toolchain
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/gcc-mipsel-none-elf-12.3.0-linux.zip \
            --output "$RUNNER_TEMP/mips-toolchain.zip"
          unzip -q "$RUNNER_TEMP/mips-toolchain.zip" -d "$RUNNER_TEMP/mips-toolchain"
          echo "$RUNNER_TEMP/mips-toolchain/bin" >> "$GITHUB_PATH"
      - name: Build PS-X EXE
        run: |
          cmake -S dumper -B dumper/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/dumper/cmake/mipsel-none-elf.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build dumper/build
          mipsel-none-elf-readelf -h -l dumper/build/ps1biosqr.elf
          test -z "$(mipsel-none-elf-nm -u dumper/build/ps1biosqr.elf)"
      - uses: actions/upload-artifact@v4
        with:
          name: ps1biosqr
          path: |
            dumper/build/ps1biosqr.exe
            dumper/build/ps1biosqr.elf
            dumper/build/ps1biosqr.map
          if-no-files-found: error
