<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS1 BIOS Color Video Receiver</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="protocol.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <h1>PS1 BIOS Color Video Receiver</h1>
    <p class="lead">動画はこのブラウザ内だけで解析され、外部へ送信されません。</p>

    <section class="controls">
      <label>録画ファイル <input id="videoFile" type="file" accept="video/*"></label>
      <label>解析速度
        <select id="speed">
          <option value="1">1×（確実）</option>
          <option value="2" selected>2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <button id="markCorners" disabled>四隅を指定</button>
      <button id="fullFrame" disabled>画面全体を使う</button>
      <button id="start" disabled>解析開始</button>
      <button id="stop" disabled>停止</button>
    </section>

    <section class="seek-row">
      <label>位置 <input id="seek" type="range" min="0" max="0" step="0.01" value="0" disabled></label>
      <output id="time">0:00 / 0:00</output>
    </section>

    <p id="instruction">動画を選択してください。</p>
    <canvas id="preview" width="640" height="480"></canvas>
    <video id="video" muted playsinline hidden></video>

    <section class="status-panel">
      <progress id="progress" value="0" max="1"></progress>
      <p id="status">待機中</p>
      <p id="details"></p>
      <a id="download" hidden download="bios.bin">復元したBIOSを保存</a>
    </section>
  </main>
</body>
</html>
